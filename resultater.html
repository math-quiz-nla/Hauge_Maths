<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testresultater</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #27ae60;
      --bg: #f4f6f9;
      --card: #fff;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 800px;
      margin: auto;
    }
    .scale {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .scale div {
      flex: 1 0 100px;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
    }
    .low {
      background: #e74c3c;
    }
    .basic {
      background: #f39c12;
    }
    .intermediate {
      background: #27ae60;
    }
    .advanced {
      background: #2980b9;
    }
    .expert {
      background: #8e44ad;
    }
    canvas {
      background: var(--card);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      padding: 1rem;
    }
    #bar {
      display: none;
    }
    .score-badge {
      text-align: center;
      font-weight: 600;
      font-size: 1.125rem;
    }
    .chart-toggle {
      text-align: center;
      margin-bottom: 1rem;
    }
    .chart-toggle button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chart-toggle button:hover {
      background: #219150;
    }
    @media (max-width: 480px) {
      #radar {
        display: none !important;
      }
      #bar {
        display: block;
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --shadow: none;
      }
      body {
        color: #e5e7eb;
      }
    }
  </style>
</head>
<body>
  <h1>Dine testresultater</h1>
	<div class="score-badge">
      Total poengsum: <span id="total-score"></span>/60
    </div>
  <div class="wrapper">
    <div class="scale">
      <div class="low">0‑12 Nybegynner</div>
      <div class="basic">13‑24 Grunnleggende</div>
      <div class="intermediate">25‑36 Mellomnivå</div>
      <div class="advanced">37‑48 Avansert</div>
      <div class="expert">49‑60 Ekspert</div>
    </div>
    <div class="chart-toggle">
      <button onclick="showRadarChart()">Radardiagram</button>
      <button onclick="showBarChart()">Søylediagram</button>
    </div>
    <canvas id="radar" height="350"></canvas>
    <canvas id="bar" height="350"></canvas>
    <div id="weak-categories"></div>
  </div>
  <script>
  const categories = ["number_system", "fractions", "percentages", "order_of_operations", "parenthesis", "coordinate_system", "exponents", "radicals", "expressions", "factorization", "logarithms", "functions"];
  
  const categoryNamesMapped = {
    "number_system": "Tallsystemet",
    "fractions": "Brøk",
    "percentages": "Prosent",
    "order_of_operations": "Regnerekkefølge",
    "parenthesis": "Arbeid med parenteser",
    "coordinate_system": "Koordinatsystemet",
    "exponents": "Potenser",
    "radicals": "Røtter",
    "expressions": "Forenkling av uttrykk",
    "factorization": "Faktorisering",
    "logarithms": "Logaritmer",
    "functions": "Funksjoner"
  };

  const scores = categories.map(category => parseInt(localStorage.getItem(category) || 0));
  const totalScore = scores.reduce((acc, score) => acc + score, 0);
  document.getElementById("total-score").textContent = totalScore;

  const radarCtx = document.getElementById("radar").getContext("2d");
  const barCtx = document.getElementById("bar").getContext("2d");

  // Determine color based on total score
  let color, bgColor;
  if (totalScore <= 12) {
    color = 'rgba(231, 76, 60, 1)';
    bgColor = 'rgba(231, 76, 60, 0.2)';
  } else if (totalScore <= 24) {
    color = 'rgba(243, 156, 18, 1)';
    bgColor = 'rgba(243, 156, 18, 0.2)';
  } else if (totalScore <= 36) {
    color = 'rgba(39, 174, 96, 1)';
    bgColor = 'rgba(39, 174, 96, 0.2)';
  } else if (totalScore <= 48) {
    color = 'rgba(41, 128, 185, 1)';
    bgColor = 'rgba(41, 128, 185, 0.2)';
  } else {
    color = 'rgba(142, 68, 173, 1)';
    bgColor = 'rgba(142, 68, 173, 0.2)';
  }

const getColor = (score, alpha = 1) => {
  if (score <= 1) return `rgba(231, 76, 60, ${alpha})`;      
  if (score <= 2) return `rgba(243, 156, 18, ${alpha})`;     
  if (score <= 3) return `rgba(39, 174, 96, ${alpha})`;      
  if (score <= 4) return `rgba(41, 128, 185, ${alpha})`;     
  return `rgba(142, 68, 173, ${alpha})`;                      
};

const radarChart = new Chart(radarCtx, {
  type: 'radar',
  data: {
    labels: categories.map(cat => categoryNamesMapped[cat] || cat),
    datasets: [{
      label: 'Testresultater',
      data: scores,
      fill: false,
      pointBackgroundColor: scores.map(score => getColor(score)),
      pointBorderColor: scores.map(score => getColor(score)),
      pointHoverBackgroundColor: scores.map(score => getColor(score)),
      pointHoverBorderColor: scores.map(score => getColor(score)),
      borderColor: '#ccc',
      borderWidth: 1
    }]
  },
  options: {
  scales: {
    r: {
      suggestedMin: 0,
      suggestedMax: 5,
      pointLabels: {
        font: {
          size: 14 
        }
      },
      ticks: {
        backdropColor: 'transparent',
        font: {
          size: 12
        }
      }
    }
  }
}
});

 const getBarColor = (score) => {
  if (score <= 1) return 'rgba(231, 76, 60, 0.6)';     
  if (score <= 2) return 'rgba(243, 156, 18, 0.6)';     
  if (score <= 3) return 'rgba(39, 174, 96, 0.6)';      
  if (score <= 4) return 'rgba(41, 128, 185, 0.6)';     
  return 'rgba(142, 68, 173, 0.6)';                      
};

const getBarBorderColor = (score) => {
  if (score <= 1) return 'rgba(231, 76, 60, 1)';
  if (score <= 2) return 'rgba(243, 156, 18, 1)';
  if (score <= 3) return 'rgba(39, 174, 96, 1)';
  if (score <= 4) return 'rgba(41, 128, 185, 1)';
  return 'rgba(142, 68, 173, 1)';
};

const barChart = new Chart(barCtx, {
  type: 'bar',
  data: {
    labels: categories.map(cat => categoryNamesMapped[cat] || cat),
    datasets: [{
      label: 'Poeng per kategori',
      data: scores,
      backgroundColor: scores.map(score => getBarColor(score)),
      borderColor: scores.map(score => getBarBorderColor(score)),
      borderWidth: 1
    }]
  },
  options: {
    scales: {
      y: {
        beginAtZero: true,
        suggestedMax: 5,
        ticks: {
          stepSize: 1,
          font: {
            size: 12
          }
        }
      }
    },
    plugins: {
      legend: {
        labels: {
          font: {
            size: 14
          }
        }
      }
    }
  }
});

  function showRadarChart() {
    document.getElementById('radar').style.display = 'block';
    document.getElementById('bar').style.display = 'none';
  }

  function showBarChart() {
    document.getElementById('radar').style.display = 'none';
    document.getElementById('bar').style.display = 'block';
  }

  // Show radar by default
  showRadarChart();

  // Suggest resources for ALL categories
  // Anbefaling basert på total poengsum
let recommendationHTML = "";

if (totalScore < 35) {
  recommendationHTML = `
    <h2>Anbefalt forberedelse</h2>
    <p>
      Basert på resultatene dine anbefaler vi <strong>sterkt</strong> at du tar forkurset i matematikk tilgjengelig på Canvas på.
    </p>
    <p>
      <a href="https://nla.instructure.com/courses/7034/pages/forkurs-i-matematikk" target="_blank">
        Forkurs i matematikk
      </a>
    </p>
  `;
} else {
  recommendationHTML = `
    <h2>Anbefalt forberedelse</h2>
    <p>
      Resultatene dine tyder på at du har et godt grunnlag. Likevel anbefaler vi at du går gjennom forkurset for å repetere og styrke ferdighetene dine.Forkurset er tilgjengelig på Canvas på.
    </p>
    <p>
      <a href="https://nla.instructure.com/courses/7034/pages/forkurs-i-matematikk" target="_blank">
        Forkurs i matematikk
      </a>
    </p>
  `;
}

document.getElementById("weak-categories").innerHTML = recommendationHTML;
``

</script>
</body>
</html>
